title = Buildat Minimal
author = celeron55
description = The smallest Luanti game that shows builtin/luanti works: one node, one mod, one floor. Shipped with buildat so that the module is demonstrable without a Luanti installation.
# [LUANTI_DARK_JOIN] No mapgen aliases (mapgen_stone, the waters): a mapgen
# with terrain made it all of "ignore", which stops sunlight, and a seed's
# hills over the floor left everything under them unlit
allowed_mapgens = singlenode
