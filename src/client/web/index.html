<!doctype html>
<!-- The web client's page ([WEB_CLIENT] in doc/plan/web_client_plan.md).
The game server serves this, buildat.js, buildat.wasm and buildat.data, and
the client connects back to the server the page came from. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,
	maximum-scale=1, user-scalable=no">
<title>Buildat</title>
<style>
html, body { margin: 0; height: 100%; background: #202020; overflow: hidden;
	touch-action: none; }
/* 100dvh: the viewport that is visible. 100vh is the one with a phone
   browser's toolbar away, and what the toolbar covered was cut off. */
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh;
	outline: none; touch-action: none; }
#text, #password { position: fixed; display: none; margin: 0; padding: 0; border: 0;
	resize: none; overflow: hidden; white-space: pre; opacity: 0;
	font-size: 16px; pointer-events: none; }
/* A login form's name for a password manager ([LOGIN_UNLOADED]) */
#username { position: fixed; left: 0; top: 0; width: 1px; height: 1px;
	margin: 0; padding: 0; border: 0; opacity: 0; pointer-events: none; }
/* [JOIN_STRIPES] the page's own wait, as the client's loading screen */
@font-face { font-family: 'Overpass Mono'; src: url(Fonts/OverpassMono-Regular.ttf); }
#load { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #15151a;
	pointer-events: none; font-family: 'Overpass Mono', monospace; }
#load div { position: absolute; left: 0; right: 0; background: #1b1b22;
	display: flex; align-items: center; justify-content: center; white-space: pre;
	overflow: hidden; }
#load1 { color: #ff9e1f; }
#load2 { color: #26d9ff; }
#load canvas { image-rendering: pixelated; }
#status { position: fixed; left: 0; right: 0; top: 40%; text-align: center;
	color: #ddd; font: 16px sans-serif; white-space: pre-wrap; pointer-events: none; }
/* [WEB_LOCAL_PLAYER_NAME] A ?local= page's player's name, asked once */
#name { position: fixed; left: 0; right: 0; top: 15%; display: none;
	text-align: center; color: #ddd; font: 16px 'Overpass Mono', monospace; }
#name input, #name button { font: inherit; padding: 6px 10px; margin: 6px; }
#name a { color: #26d9ff; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<textarea id="text" autocomplete="off" autocorrect="off" autocapitalize="off"
	spellcheck="false" tabindex="-1"></textarea>
<form id="login" onsubmit="return false">
<input id="username" autocomplete="username" tabindex="-1">
<input id="password" type="password" autocomplete="off" tabindex="-1">
</form>
<div id="load"><div id="load1"></div><div id="load2"><canvas width="16"
	height="16"></canvas><span></span></div></div>
<div id="status"></div>
<form id="name" autocomplete="off"><div id="name_ask">Your name in this browser's
games<br><input id="name_in" maxlength="20" spellcheck="false"><button>Play</button>
<div id="name_why"></div></div><div id="name_as">Playing as <span></span> &middot;
<a id="name_change">change</a></div></form>
<script>
(function(){
	var status = document.getElementById('status');
	var canvas = document.getElementById('canvas');
	// **The start says what it is doing** ([LOAD_SHOWN]) **in the client's
	// stripes** ([JOIN_STRIPES], user 2026-10-12): the line and its seconds
	// on stripe one, what is coming on stripe two, at the places and sizes
	// of the client's loading screen (ui_utils' load_fit()) at its
	// automatic UI scale (app.cpp's apply_ui_scale()). The engine's first
	// frame draws its own over the same places and these go.
	// simplified: a UI scale the user set is in the saved files, read after
	// these downloads; the stripes change size at the first frame then
	var load = document.getElementById('load');
	var load1 = document.getElementById('load1');
	var load2 = document.getElementById('load2');
	var load_name = load2.lastChild, glyph = load2.firstChild;
	// The page glyph's rows, ui_utils' GLYPHS.page
	(function(){
		var rows = ['................', '...#######......', '...#.....##.....',
			'...#.....#.#....', '...#.....####...', '...#........#...',
			'...#.####...#...', '...#........#...', '...#.#####..#...',
			'...#........#...', '...#.####...#...', '...#........#...',
			'...#.#####..#...', '...#........#...', '...##########...',
			'................'];
		var g = glyph.getContext('2d');
		g.fillStyle = '#fff';
		for(var y = 0; y < 16; y++)
			for(var x = 0; x < 16; x++)
				if(rows[y][x] === '#')
					g.fillRect(x, y, 1, 1);
	})();
	// The UI scale in CSS pixels: UI_REF_SHORT 1080, snapped to a whole
	// one 8% under to 12% over; at least 1, half again for a finger, and
	// a short side of UI_MIN_SHORT 400 kept
	function css_scale(){
		var short = Math.min(window.innerWidth, window.innerHeight);
		var s = short / 1080, n = Math.floor(s + 0.5);
		if(n >= 1 && s >= n * 0.92 && s <= n * 1.12)
			s = n;
		s = Math.max(s, 1);
		if(window.matchMedia && matchMedia('(pointer: coarse)').matches)
			s *= 1.5;
		return Math.min(s, short / 400);
	}
	// A Text's line at 13 UI pixels, as the client's font face makes it
	// (Urho3D's FontFaceFreeType): the pixels per em of 13 points at 96
	// DPI at the device's scale, and Overpass Mono's OS/2 win ascent and
	// descent (2316 + 756 of 2000 units) over that, in UI pixels again
	function line_h(size, dev){
		var ppem = Math.floor((Math.floor(size * dev * 64) * 96 / 72 + 32) / 64);
		return Math.floor(3072 * ppem / 2000 / dev + 0.5);
	}
	function stripes(){
		var k = css_scale();
		var h = Math.floor(window.innerHeight / k), size = 13;
		var lh = line_h(size, k * (window.devicePixelRatio || 1));
		var h1 = lh + Math.floor(size / 2);
		var h2 = Math.floor(h1 * 1.5);
		var top = Math.floor(h / 2 - lh / 2) - h1;
		var side = h2 - Math.floor(size / 2);
		// Urho's font size is in points at 96 DPI
		load.style.fontSize = (size * 96 / 72 * k) + 'px';
		load1.style.top = (top * k) + 'px';
		load1.style.height = (h1 * k) + 'px';
		load2.style.top = ((top + h1 + lh) * k) + 'px';
		load2.style.height = (h2 * k) + 'px';
		load2.style.visibility = load_name.textContent ? '' : 'hidden';
		glyph.style.width = glyph.style.height = (side * k) + 'px';
		glyph.style.marginRight = (Math.floor(size / 2) * k) + 'px';
	}
	window.addEventListener('resize', stripes);
	var shown = '', shown_at = Date.now();
	function set_status(t){
		// Emscripten's own empty line, when its download is done, is the
		// engine starting: the client's first frame says so (buildatUp),
		// and the client's screen is up from there
		if(t === '' && Module.buildatUp){
			load.style.display = 'none';
			document.getElementById('name').style.display = 'none';
			return;
		}
		// Emscripten's data download, "Downloading data... (a/b)"
		var m = /\((\d+)\/(\d+)\)/.exec(t);
		if(m)
			return coming(client + '.data', +m[1], +m[2]);
		if(t === '' || /^Running/.test(t))
			t = 'Starting the engine';
		if(t !== shown)
			shown_at = Date.now();
		shown = t.replace(/\.+$/, '');
		tick();
	}
	// coming(name, have, size): stripe two; size 0 when not known
	function coming(name, have, size){
		load_name.textContent = name + '  ' + (have / 1e6).toFixed(1) +
			(size ? ' of ' + (size / 1e6).toFixed(1) : '') + ' MB';
		if(shown !== 'Loading the client'){
			shown = 'Loading the client';
			shown_at = Date.now();
		}
		tick();
	}
	function tick(){
		load1.textContent = shown + '... ' +
			Math.floor((Date.now() - shown_at) / 1000) + ' s';
		stripes();
	}
	setInterval(tick, 500);
	set_status('Loading the client');
	var https = location.protocol === 'https:';
	// An installed package's id, its version not "." or ".."
	var PACKAGE_ID = /^([a-z0-9_]{1,40})\.([A-Za-z0-9_]{1,64})@([0-9A-Za-z][0-9A-Za-z.+\-]{0,39})$/;
	// The server that served this page; behind a reverse proxy the port is
	// the page's, 443 or 80 when the address has none
	var port = location.port || (https ? '443' : '80');
	var host = location.hostname.indexOf(':') >= 0 ?
			'[' + location.hostname + ']' : location.hostname;
	// [WEB_ID_TRUST] (d): a page with no game of its own says null here
	// (the server serves it so: apps/play) and starts on the launch menu,
	// which connects in place to the server the user picks
	var server = host + ':' + port;
	var query = new URLSearchParams(location.search);
	// [WEB_LOCAL_SERVER] ?local=<app>: the app's own server, built for the
	// web (util/build_web_server.sh) and served beside this page under
	// local/<app>/, run in a worker of this page (start_local below) and
	// joined through it. A query and not a hash: the server sends this
	// page cross-origin isolated for it (the worker's threads share
	// memory) even where ?isolated=0 asks the play page not to be.
	var local_app = /^[A-Za-z0-9_]{1,64}$/.exec(query.get('local') || '');
	// [WEB_LOCAL_AITTA] ?local=<author>.<name>@<version>: a package from
	// Aitta that the client installed (its signature checked) with the
	// .wasm its Aitta built, under .web/ in its directory; the engine's
	// server for packages (local/_aitta/) runs it, the files sent to it
	// once the client's storage is read (start_package below)
	var local_pkg = PACKAGE_ID.exec(query.get('local') || '');
	if(local_app || local_pkg)
		server = 'pipe:page';
	// The apps beside this page that have a server for it (local/<app>/),
	// which the buildat server writes in here on a page with no game: the
	// launch menu offers each, going to ?local=<app>
	var local_apps = [];
	// [WEB_MESH_OFF_THREAD] The app's meta.json "needs", which the buildat
	// server writes in here: {memory_mb, mesh_threads}
	var needs = null;
	// [WEB_PLAY_AFTER_MERGE] The default Starport, Aitta and Hearth the
	// buildat server writes in here from its BUILDAT_*_DEFAULT:
	// {STARPORT, AITTA, HEARTH}
	var default_hosts = null;
	var args = ['-P', '/buildat', '-U', '/urho', '-C', '/buildat/cache',
		'-D', '/buildat/user',
		'-w', window.innerWidth + 'x' + window.innerHeight];
	if(server)
		args.push('-s', server);
	// [PLAY_LINKS] the play page's ?server=host:port, a Starport's link:
	// the launch menu joins it if a Starport in its settings lists it.
	// Only that shape is taken; the client checks it again.
	var join = null;
	var jm = /^([A-Za-z0-9.\-]{1,253}:[0-9]{1,5})$/.exec(query.get('server') || '');
	if(!server && jm)
		join = jm[1];
	// [HEARTH_OPEN_HERE] #open=<a page's path>, as a web page's "in the
	// browser" link writes it: a place for the app to go and nothing else,
	// so only that shape is taken; the app checks it again
	// [WEB_RELOAD_APPS] Not on a reload, the page's own or the one a
	// return after the browser dropped it makes: the app's kept place is
	// where the user was since
	var open_ = null;
	// [SERVERLESS_PLAY] #run=<author>/<name>, an Aitta page's "Play in the
	// browser": the launch menu runs that app with no server, from the
	// Aittas in its settings
	var run = null;
	var nav = performance.getEntriesByType &&
			performance.getEntriesByType('navigation')[0];
	if(location.hash && !(nav && nav.type === 'reload')){
		var om = /^#open=(\/(topic|t|m|p|u)\/[A-Za-z0-9_.\-\/]{1,200})$/
				.exec(location.hash);
		var rm = /^#run=([A-Za-z0-9_]{1,64}\/[A-Za-z0-9_]{1,64})$/
				.exec(location.hash);
		if(om)
			open_ = om[1];
		else if(rm && !server)
			run = rm[1];
		else
			console.log('Not taken from the address: ' + location.hash);
	}
	// The query's key=value pairs ([COMPAT_BREAK_07] 8i): ?log=4 for a
	// verbose log, scale=<UI scale>, pref=<key>=<value> (any number).
	// **These only** ([SECURITY_RUN_1]): a link is anybody's to write, and
	// with every flag a link to a real server's page ran its command
	// sequence -- keys and text in the user's session, typed into an
	// admin's chat -- or connected to another server inside this one's
	// origin. No command-line flag passes through.
	var flags = {log: '-l', scale: '-u', pref: '-o'};
	// ?frame_split=1: the frame's split logged every 10 s
	// ([WEB_MAIN_THREAD]); a log line, nothing else
	var frame_split = false;
	query.forEach(function(value, key){
		if(flags.hasOwnProperty(key))
			args.push(flags[key], value);
		else if(key === 'frame_split')
			frame_split = value === '1';
		else if(key !== 'server' && key !== 'local' && key !== 'isolated')
			console.log('Not taken from the address: ' + key);
	});
	// **Back in by itself** (user, 2026-09-30): a phone's browser drops
	// the connection of a page that has been in the background for some
	// seconds (Vivaldi on Android, another app in front). A disconnect after
	// the page was away reloads it once it is in front again; one while it
	// was in front waits for the user to go away and come back, so that a
	// server that is down is not reloaded over and over. Only for a game
	// that asked, with buildat.set_reload_on_return(true): a heavy one
	// (vanilla) is not loaded again without the user saying so.
	var away_now = false, back_at = 0, disconnected = false;
	function present(){
		return document.visibilityState === 'visible' && document.hasFocus();
	}
	function away(){
		away_now = true;
	}
	function back(){
		if(!present() || !away_now)
			return;
		away_now = false;
		back_at = Date.now();
		if(disconnected && Module.buildatReloadOnReturn)
			location.reload();
	}
	document.addEventListener('visibilitychange', function(){
		if(document.visibilityState === 'hidden')
			away();
		else
			back();
	});
	window.addEventListener('blur', away);
	window.addEventListener('focus', back);
	// **The last input, for the idle frame rate** ([WEB_IDLE_FPS], app.cpp
	// web_idle_step): the client reads buildatInputAt each frame, and while
	// it is slow it leaves buildatWake here for the first input to call
	function input(){
		var m = window.Module;
		if(!m)
			return;
		m.buildatInputAt = Date.now();
		if(m.buildatWake)
			m.buildatWake();
	}
	['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'focus']
			.forEach(function(e){
		window.addEventListener(e, input, {capture: true, passive: true});
	});
	// **A turn's new size** ([ROTATE_ASPECT]): SDL reads the canvas's CSS
	// size at the window's resize, and on a phone the resize of a turn can
	// come before the page is laid out again: the old size was read, the
	// drawing buffer kept it stretched to the new shape, and nothing came
	// after. So once laid out, the window is told again (SDL does nothing
	// for a size it has).
	function resize_again(){
		requestAnimationFrame(function(){
			requestAnimationFrame(function(){
				window.dispatchEvent(new Event('resize'));
			});
		});
		setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 300);
	}
	window.addEventListener('orientationchange', resize_again);
	if(screen.orientation && screen.orientation.addEventListener)
		screen.orientation.addEventListener('change', resize_again);
	window.addEventListener('resize', function(e){
		if(e.isTrusted)
			resize_again();
	});
	// **Fullscreen on a touchscreen while the game wants it** (user,
	// 2026-09-30): a phone browser's address bar covers a page that does
	// not scroll, and only fullscreen puts it away. A game says when, with
	// buildat.set_web_fullscreen() (the floorplanner: whenever its menu is
	// not up, which then brings the bar back). Entering takes a tap, so
	// each tap asks; leaving is at once.
	// **The address bar is a preference** ([WEB_ADDRESS_BAR]):
	// buildatAddressBar is "hide", "show", or empty for the default --
	// hidden on a small touchscreen (a coarse pointer, a short side under
	// 600 CSS pixels), shown on a desktop
	var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
	function hide_by_default(){
		return coarse && Math.min(screen.width, screen.height) < 600;
	}
	// **The screen's orientation** ([SCREEN_ORIENTATION]):
	// buildatOrientation is "auto", "landscape" or "portrait". A browser
	// holds a lock only while the page is fullscreen (Chrome for Android)
	// or not at all (iOS Safari), so it is asked again at every entry, and
	// while one is set the page stays fullscreen over a game's menu too,
	// or the screen would turn back mid-menu. buildatOrientationError is
	// why the last lock was refused.
	function orientation(){
		var o = Module.buildatOrientation;
		return o === 'landscape' || o === 'portrait' ? o : '';
	}
	var orientation_said = null;
	// What was asked since fullscreen was last entered
	var orientation_applied = null;
	function apply_orientation(){
		var o = orientation();
		var so = screen.orientation;
		if(!document.fullscreenElement || !so || !so.lock)
			return;
		orientation_applied = o;
		console.log('orientation: ' + (o ? 'lock ' + o : 'unlock'));
		if(!o){
			try { so.unlock(); } catch(e){}
			return;
		}
		so.lock(o).then(function(){
			Module.buildatOrientationError = null;
		}, function(e){
			Module.buildatOrientationError = String(e && e.message || e);
			if(orientation_said !== Module.buildatOrientationError){
				orientation_said = Module.buildatOrientationError;
				console.log('orientation: the lock refused: ' + orientation_said);
			}
		});
	}
	document.addEventListener('fullscreenchange', function(){
		orientation_applied = null;
		apply_orientation();
	});
	function sync_fullscreen(){
		var pref = Module.buildatAddressBar;
		var want = (Module.buildatFullscreen || orientation() !== '') &&
				(pref ? pref === 'hide' : hide_by_default());
		var el = document.documentElement;
		try {
			if(want && !document.fullscreenElement && el.requestFullscreen)
				el.requestFullscreen().catch(function(){});
			// Only the page's own: the client's fullscreen setting is the
			// same API, on the canvas
			else if(!want && document.fullscreenElement === el &&
					document.exitFullscreen)
				document.exitFullscreen().catch(function(){});
		} catch(e){}
		// A change while fullscreen
		if(document.fullscreenElement && orientation_applied !== orientation())
			apply_orientation();
	}
	// Entering takes a gesture: a tap, or a click where "hide" was chosen
	// on a desktop
	document.addEventListener('touchend', sync_fullscreen, true);
	document.addEventListener('mouseup', sync_fullscreen, true);
	// **The browser's Back is the client's** ([TAP_BACK]): entries of this
	// page's own sit on the history, {buildat: n} the n-th over the one the
	// page was loaded on, and Back onto one of them is Escape on the
	// client's top screen (app.cpp reads buildatBack) while a screen is
	// over the first one (buildatBackDepth, uistack). On the first screen
	// Back leaves, past the page's own entries.
	// [HEARTH_WEB_BACK] A browser skips an entry pushed with no tap or key
	// after it, so the entries are pushed while the page has one -- on a
	// tap, a click or a key, and when the depth changes -- one more than
	// the depth, so the screen a tap opens has its entry already. One
	// pushed in a popstate is only for a Back that ran out of them.
	// simplified: a depth that rises with no input (a game's own timer)
	// has no entry until the next tap or key; Back then leaves
	// The entries before this page's first, one of them its own load
	var history_base = history.length - back_pos();
	function back_pos(){
		return (history.state && history.state.buildat) | 0;
	}
	function fill_back(){
		var m = window.Module;
		var want = Math.max(1, m ? m.buildatBackDepth | 0 : 0);
		for(var n = back_pos() + 1; n <= want; n++)
			history.pushState({buildat: n}, '');
	}
	['touchend', 'mousedown', 'keydown'].forEach(function(e){
		document.addEventListener(e, fill_back, true);
	});
	fill_back();
	var leaving = false;
	window.addEventListener('popstate', function(){
		var m = window.Module;
		if(leaving)
			return;
		if(m && (m.buildatBackDepth | 0) > 1){
			if(back_pos() == 0)
				history.pushState({buildat: 1}, '');
			m.buildatBack = (m.buildatBack | 0) + 1;
		} else if(history_base > 1){
			leaving = true;
			history.go(-(back_pos() + 1));
		}
	});
	function set_back_depth(n){
		window.Module.buildatBackDepth = n;
		fill_back();
	}
	// The client's leave_web_page(go): whether there is a page before this
	// one (the history it was loaded on had one), and with go, back to it
	function leave_page(go){
		if(history_base < 2)
			return 0;
		if(go){
			leaving = true;
			history.go(-(back_pos() + 1));
		}
		return 1;
	}
	// **Meshing off the page's thread** ([WEB_MESH_OFF_THREAD]): where the
	// page is cross-origin isolated (SharedArrayBuffer), the client with
	// threads (buildat_mt), its mesh pool on workers; else the one
	// without, which meshes a slice a frame on this thread. The shared
	// memory is made here, the largest maximum the browser grants: iOS
	// refuses a large reservation, and a smaller maximum there beats no
	// threads. The workers, a core left for this thread, at most 4 (the
	// native client's). What was got goes to the client, which tells the
	// apps (buildat.resources()).
	var MB = 1048576;
	var mt = (function(){
		if(!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined')
			return null;
		var maxima = [2048, 1536, 1024, 768, 512, 384, 256];
		for(var i = 0; i < maxima.length; i++){
			try {
				// The initial size is the build's INITIAL_MEMORY, 256 MB
				var mem = new WebAssembly.Memory({initial: 256 * MB / 65536,
						maximum: maxima[i] * MB / 65536, shared: true});
				if(!(mem.buffer instanceof SharedArrayBuffer))
					return null;
				var cores = navigator.hardwareConcurrency || 2;
				return {memory: mem, memory_mb: maxima[i],
						threads: Math.max(1, Math.min(4, cores - 1))};
			} catch(e){
				console.log('threads: no shared memory of ' + maxima[i] +
						' MB (' + e + ')');
			}
		}
		return null;
	})();
	var client = mt ? 'buildat_mt' : 'buildat';
	window.Module = {
		canvas: canvas,
		arguments: args,
		// Emscripten's sockets are WebSockets to this address and port
		websocket: { url: https ? 'wss://' : 'ws://', subprotocol: 'binary' },
		preRun: [function(){
			FS.mkdir('/buildat/cache');
			FS.mkdir('/buildat/user');
			// **Kept between loads** ([WEB_PERSIST]): the files the server
			// sent, and what games store on the client, in IndexedDB. Read
			// back before the client starts, written out every few seconds
			// and when the page is hidden.
			// The listing and the reads in one turn: IDBFS's own write
			// waits for IndexedDB's list between them, and a file the
			// client wrote or removed meanwhile was a half write or an
			// error (src/server/web/pre.js has the same).
			// simplified: the cache grows until the browser evicts the site
			var idb = FS.filesystems.IDBFS, syncfs = idb.syncfs;
			idb.syncfs = function(m, populate, done){
				if(populate)

		var k = canvas.clientWidth / canvas.width;
		var st = el.style;
		var box = [x * k, y * k, w * k, h * k].map(Math.round).join(',');
		if(el.dataset.box !== box){
			el.dataset.box = box;
			var b = box.split(',');
			st.left = b[0] + 'px'; st.top = b[1] + 'px';
			st.width = b[2] + 'px'; st.height = b[3] + 'px';
		}
		if(!active){
			active = true;
			st.display = 'block';
		}
		if(tap && document.activeElement === el)
			el.blur();
		if(document.activeElement !== el)
			el.focus({preventScroll: true});
	}
	// **A tap on a field focuses its stand-in in the tap's own event**
	// ([WEB_TAP_KEYBOARD]): a phone's browser opens its keyboard only for a
	// focus the user's touch made, and the engine's own (sync()) comes a
	// frame later. The engine gives the fields shown (app.cpp
	// web_fields_publish()), the topmost last.
	var fields = [];
	// **The tap's focus held** ([WEB_TAP_KEYBOARD_IOS]): until the engine
	// reports the tapped field, at most `held` frames, a sync of no field
	// or of another (the engine before it has had the tap) leaves the
	// stand-in be. Taking it away was a blur, which on iOS closes the
	// keyboard the tap opened, and the engine's own focus a frame later
	// opens none there. `tapped` is the field's box.
	var held = 0, tapped = '';
	document.addEventListener('touchstart', function(){
		if(window.Module)
			Module.buildatTouched = 1;
	}, true);
	canvas.addEventListener('touchend', function(e){
		var t = e.changedTouches[0];
		if(!t || !fields.length)
			return;
		var r = canvas.getBoundingClientRect();
		var x = (t.clientX - r.left) * canvas.width / canvas.clientWidth,
				y = (t.clientY - r.top) * canvas.height / canvas.clientHeight;
		for(var i = fields.length - 1; i >= 0; i--){
			var f = fields[i];
			if(x >= f[0] && x < f[0] + f[2] && y >= f[1] && y < f[1] + f[3]){
				place(f[4] === 1, f[0], f[1], f[2], f[3], true);
				held = 10;
				tapped = f.slice(0, 4).join(',');
				console.log('buildatText: a field focused in the tap: ' +
						(document.activeElement === el ? el.id : 'not focused'));
				return;
			}
		}
	}, true);
	window.buildatText = {
		take: function(){ return actions.length ? actions.shift() : null; },
		fields: function(s){
			fields = s.split(';').filter(Boolean).map(function(f){
				return f.split(',').map(Number);
			});
		},
		sync: function(x, y, w, h, text, start, len, editable, secret, multi,
				purpose, user){
			if(held > 0){
				if(x !== null && [x, y, w, h].map(Math.floor).join(',') === tapped)
					held = 0;
				else {
					held--;
					return;
				}
			}
			if(x === null){
				if(active){
					active = false;
					el.style.display = 'none';
					el.value = '';
					canvas.focus();
				}
				return;
			}
			place(secret, x, y, w, h);
			el.readOnly = !editable;
			el.dataset.multi = multi ? '1' : '';
			if(el.getAttribute('autocomplete') !== (purpose || 'off'))
				el.setAttribute('autocomplete', purpose || 'off');
			if(secret && user !== null && un.value !== user &&
					document.activeElement !== un)
				un.value = user;
			// Setting the value would end an IME's composition
			if(composing)
				return;
			if(el.value !== text)
				el.value = text;
			var a = units(text, start), b = units(text, start + len);
			if(el.selectionStart !== a || el.selectionEnd !== b)
				el.setSelectionRange(a, b);
			el.dataset.sel = a + ',' + b;
		},
	};
	document.addEventListener('selectionchange', selected);
	// For the phone's Web Inspector: what took the focus off a stand-in
	[ta, pw].forEach(function(e){
		e.addEventListener('blur', function(ev){
			var to = ev.relatedTarget;
			console.log('buildatText: ' + e.id + ' blurred, the focus to ' +
					(to ? to.id || to.tagName : 'none'));
		});
	});
	// The native field's word rule ([TEXT_KEYS], LineEdit.cpp WordLeft):
	// back over what is not a word, then the word, any non-ASCII a letter;
	// a line break is a step of its own, with the spaces before it.
	// util/text_keys_check.sh runs this function.
	function wordLeft(v, a){
		var word = function(c){ return c > '\x7f' || /\w/.test(c); };
		if(a > 0 && v[a - 1] === '\n'){
			for(a--; a > 0 && (v[a - 1] === ' ' || v[a - 1] === '\t'); a--);
			return a;
		}
		while(a > 0 && !word(v[a - 1]) && v[a - 1] !== '\n')
			a--;
		while(a > 0 && word(v[a - 1]))
			a--;
		return a;
	}
	[ta, pw].forEach(function(e){
		e.addEventListener('select', selected);
		e.addEventListener('compositionstart', function(){ composing = true; });
		e.addEventListener('compositionend', function(){ composing = false; });
		e.addEventListener('paste', function(ev){
			ev.preventDefault();
			// A line edit is one line; a multi-line one keeps its lines
			var t = ev.clipboardData.getData('text/plain');
			t = e.dataset.multi ? t.replace(/\r\n?/g, '\n') :
					t.replace(/[\r\n\t]+/g, ' ');
			if(t && !e.readOnly)
				actions.push('i' + t);
		});
		e.addEventListener('input', function(){
			if(e !== el || e.readOnly)
				return;
			var v = e.value;
			// A touchscreen keyboard's Enter is a line break in the text:
			// taken out, and the field's Enter (user, 2026-09-30)
			// In a multi-line field the line break is the text's own
			var enter = !e.dataset.multi && /[\r\n]/.test(v);
			if(enter)
				v = e.value = v.replace(/[\r\n]+/g, '');
			// One line, whatever a suggestion put in
			if(!e.dataset.multi && /\t/.test(v))
				v = e.value = v.replace(/\t+/g, ' ');
			var caret = chars(v, e.selectionEnd);
			e.dataset.sel = e.selectionStart + ',' + e.selectionEnd;
			actions.push('v' + caret + ',' + v);
			if(enter)
				actions.push('e');
		});
		// And a password input's, which puts nothing in the text
		e.addEventListener('keydown', function(ev){
			// Undo and redo are the field's own ([TEXT_UNDO], LineEdit
			// hears the keys too): the browser's would undo the syncs
			var k = ev.key.toLowerCase();
			if((ev.ctrlKey || ev.metaKey) && (k === 'z' || k === 'y')){
				ev.preventDefault();
				return;
			}
			// Alt+Backspace deletes back a word, which Firefox and Chromium
			// on Linux do not
			if(ev.key === 'Backspace' && ev.altKey && !ev.ctrlKey && !e.readOnly){
				ev.preventDefault();
				var a = e.selectionStart, b = e.selectionEnd;
				if(a === b)
					a = wordLeft(e.value, a);
				e.setRangeText('', a, b, 'end');
				e.dispatchEvent(new Event('input'));
				return;
			}
			if(ev.key === 'Enter' && e === pw){
				ev.preventDefault();
				actions.push('e');
			}
		});
	});
	// A right click on the focused field opens the browser's menu for it:
	// the textarea takes the press, and the game does not see it
	canvas.addEventListener('mousedown', function(e){
		if(e.button !== 2 || !active)
			return;
		var r = el.getBoundingClientRect();
		if(e.clientX < r.left || e.clientX >= r.right || e.clientY < r.top ||
				e.clientY >= r.bottom)
			return;
		e.stopImmediatePropagation();
		el.style.pointerEvents = 'auto';
	});
	[ta, pw].forEach(function(e){
		e.addEventListener('contextmenu', function(){
			setTimeout(function(){ e.style.pointerEvents = 'none'; }, 0);
		});
	});
	canvas.addEventListener('click', function(){
		(active ? el : canvas).focus({preventScroll: true});
	});
	// Text a game puts on the clipboard ([WEB_KEYS] step 3; Urho3D's
	// UI::SetClipboardText): the Clipboard API where the page is secure,
	// else execCommand('copy') on a selection of its own, which works only
	// soon after a click or key -- as the game's copy button is
	window.buildatClipboard = function(t){
		function old(){
			var had = document.activeElement;
			var x = document.createElement('textarea');
			x.value = t;
			x.style.position = 'fixed';
			x.style.opacity = '0';
			document.body.appendChild(x);
			x.select();
			try { document.execCommand('copy'); } catch(e){}
			x.remove();
			if(had)
				had.focus({preventScroll: true});
		}
		if(navigator.clipboard && window.isSecureContext)
			navigator.clipboard.writeText(t).catch(old);
		else
			old();
	};
	// Files a game hands the user and takes from them ([FP_EXPORT] 4): the
	// browser's download, and its file picker, whose file the client takes
	// with picked_file() once it has been read. src/client/app.cpp
	// l_save_file() and the ones after it.
	window.buildatFiles = {
		picked: null,
		save: function(name, bytes){
			var a = document.createElement('a');
			// bytes, or the parts of one file ([WORLD_TRIM_MOVE])
			a.href = URL.createObjectURL(new Blob(Array.isArray(bytes) ?
					bytes : [bytes]));
			a.download = name;
			document.body.appendChild(a);
			a.click();
			a.remove();
			setTimeout(function(){ URL.revokeObjectURL(a.href); }, 60000);
		},
		pick: function(accept){
			var input = document.createElement('input');
			input.type = 'file';
			if(accept)
				input.accept = accept;
			input.addEventListener('change', function(){
				var f = input.files[0];
				if(f)
					f.arrayBuffer().then(function(b){
						buildatFiles.picked = {name: f.name, data: new Uint8Array(b)};
					});
			});
			input.click();
		},
	};
	// A middle click is the game's, not the browser's paste or autoscroll
	canvas.addEventListener('auxclick', function(e){ e.preventDefault(); });
	if(mt){
		Module.wasmMemory = mt.memory;
		Module.buildatThreads = mt.threads;
	}
	// The client's script; a server whose web client has no threaded build
	// gets the one without
	function start_client(){
		var s = document.createElement('script');
		s.src = client + '.js';
		s.onerror = function(){
			if(client === 'buildat')
				return Module.onAbort('buildat.js did not load');
			console.log('threads: no ' + client + '.js here; without threads');
			mt = null;
			client = 'buildat';
			delete Module.wasmMemory;
			delete Module.buildatThreads;
			start_client();
		};
		document.body.appendChild(s);
	}
	// An app that says it needs more than this browser gave is told so
	// plainly, and the player may start it anyway
	var got = {memory_mb: mt ? mt.memory_mb : 2048, mesh_threads: mt ? mt.threads : 0};
	var lack = needs ? Object.keys(got).filter(function(k){
		return needs[k] > got[k]; }) : [];
	if(lack.length){
		var says = {
			memory_mb: 'memory up to ' + (needs.memory_mb || 0) + ' MB (this browser gave ' +
				got.memory_mb + ' MB)',
			mesh_threads: needs.mesh_threads + ' mesh threads (this browser gave ' +
				got.mesh_threads + (window.crossOriginIsolated ? '' :
				'; the page is not cross-origin isolated') + ')'};
		load.style.display = 'none';
		status.textContent = 'This game needs ' + lack.map(function(k){
			return says[k]; }).join(' and ') + '. It may run slowly or not at all.\n\n';
		var b = document.createElement('button');
		b.textContent = 'Start anyway';
		b.style.font = 'inherit';
		b.style.padding = '8px 24px';
		b.style.pointerEvents = 'auto';
		b.onclick = function(){
			status.textContent = '';
			load.style.display = '';
			start_client();
		};
		status.appendChild(b);
		console.log('needs: lack of ' + lack.join(', '));
	} else
		start_client();
	console.log('threads: ' + (mt ? mt.threads + ' mesh workers, memory ' +
			'up to ' + mt.memory_mb + ' MB' : 'none (' + (window.crossOriginIsolated ?
			'no shared memory' : 'not cross-origin isolated') + ')'));
})();
</script>
</body>
</html>
