# [CI_RUNS] (5): the checks, run the one way they are run --
# util/checks_in_docker.sh, the packaging image, Xvfb -- beside the
# archives. Started by hand only ([CI_GREEN], user, 2026-10-05): the
# ci tier ([CI_TIER]: the runners marked "# ci", no network), the
# quick tier, or the full and long tiers, on the chosen branch; the push,
# tag and schedule triggers come back once the quick tier is green. Every run's
# local/ is an artifact, if: always(), because a failure that cannot be
# read is a failure that gets ignored.
name: checks
on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'ci, quick, or nightly (full and long)'
        type: choice
        options: [ci, quick, nightly]
        default: ci
jobs:
  ci:
    if: inputs.tier == 'ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The ci tier
        run: JOBS=$(nproc) util/checks_in_docker.sh ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-run
          path: Build/checks/out/
          if-no-files-found: ignore
  quick:
    if: inputs.tier == 'quick'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The quick tier
        run: JOBS=$(nproc) util/checks_in_docker.sh quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-run
          path: Build/checks/out/
          if-no-files-found: ignore
  nightly:
    if: inputs.tier == 'nightly'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [full, long]
    steps:
      - uses: actions/checkout@v4
      # The media is ContentDB's, and a run that changes nothing
      # downloads nothing: the key is the release ids themselves
      - name: What release the media is at
        id: media
        run: echo "key=$(util/media_fetch.sh --key | md5sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: user/shared/vanilla
          key: vanilla-media-${{ steps.media.outputs.key }}
      - name: Fetch what the cache did not have
        run: util/media_fetch.sh
      - name: The ${{ matrix.tier }} tier
        run: JOBS=$(nproc) util/checks_in_docker.sh ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.tier }}-run
          path: Build/checks/out/
          if-no-files-found: ignore
