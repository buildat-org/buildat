# [PACKAGING_CI] / [SQUASH_RELEASE]: the release archives, made the one
# way they are made -- util/package_in_docker.sh, the same image as on a
# desk -- on every tag. util/release.sh tags the development branch's
# version commit v<version>, so a release builds and lands under Releases
# with the tarballs and the zips; a tag with a hash in it, as the ones
# before 2026-10-09 are, is a prerelease. The archives are workflow
# artifacts as well.
name: package
on:
  push:
    tags: ['v*']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # package_in_docker.sh names the archives by the short hash
          fetch-depth: 1
      # The web archives' smoke runs on the runner, against a bare
      # container ([LINUX_SERVER]); its transport test is python's
      - name: The web archives' smoke needs websockets
        run: sudo apt-get install -y python3-websockets
      # And Node 22 for its page check in Firefox (util/web_drive.js),
      # which the runner has
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Also the web archives ([LINUX_SERVER]): *-linux-x86_64-web
      # and -web-precompiled, which carry the web client and are in
      # the upload and the release by the same *.tar.gz
      - name: Package in the Linux image
        run: JOBS=$(nproc) util/package_in_docker.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archives
          path: Build/package/out/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke
          path: |
            Build/package/out/smoke/
            Build/package/out/web-smoke/
          if-no-files-found: ignore
      # The build trees' logs, which a failed build names and which stayed
      # in the runner: 0.5.0 to 0.5.2 failed with nothing to read
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-logs
          path: Build/package/out/logs/
          if-no-files-found: ignore
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package in the Windows cross image
        run: JOBS=$(nproc) util/package_in_docker.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: Build/package/out/*-win64.zip
          if-no-files-found: error
      # The per-user installer of the same build ([WIN_INSTALLER])
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Build/package/out/*-win64-setup.exe
          if-no-files-found: error
      # The "Luanti only" archive ([LUANTI_BUILD]): apps/vanilla and no
      # compiler, a third of the full one; the release lists it
      - uses: actions/upload-artifact@v4
        with:
          name: windows-luanti-archive
          path: Build/package/out/*-win64-luanti.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: Build/package/out/smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-logs
          path: Build/package/out/logs/
          if-no-files-found: ignore
  # One release from both builds: two jobs on one tag would race on
  # creating it. A tag with a hash in it is a prerelease; a bare
  # v<version> is the release. Its notes are the titles of the commits
  # since the previous plain tag (any tag before there was one), the
  # version bumps left out.
  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' HEAD^ 2>/dev/null ||
              git describe --tags --abbrev=0 HEAD^)
          { echo "Since $prev:"; echo
            git log --no-merges --format='- %s (%h)' "$prev..HEAD" | grep -v '^- version: ' || true
          } > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: linux-archives
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-archive
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-luanti-archive
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            out/*.tar.gz
            out/*.zip
            out/*.exe
